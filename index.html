<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Экзамен: генератор вариантов</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Segoe UI', Roboto, 'Helvetica Neue', sans-serif;
            background: #eef2f5;
            padding: 30px 20px;
            color: #1e2f3a;
        }
        .exam-container {
            max-width: 1100px;
            margin: 0 auto;
            background: white;
            border-radius: 28px;
            box-shadow: 0 20px 35px -12px rgba(0,0,0,0.15);
            padding: 30px 35px;
        }
        h1 {
            text-align: center;
            color: #1c6d8f;
            font-size: 1.9rem;
            margin-bottom: 8px;
            border-bottom: 3px solid #cbdde9;
            padding-bottom: 12px;
        }
        .sub {
            text-align: center;
            color: #3d6e8b;
            margin-bottom: 20px;
            font-style: italic;
        }
        .controls {
            display: flex;
            justify-content: center;
            gap: 20px;
            margin: 20px 0;
            flex-wrap: wrap;
        }
        button {
            background: #2c7da0;
            color: white;
            border: none;
            padding: 10px 28px;
            font-size: 1rem;
            border-radius: 60px;
            font-weight: bold;
            cursor: pointer;
            transition: 0.2s;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
        }
        button:hover {
            background: #1f5e7a;
            transform: scale(1.02);
        }
        .btn-mode {
            background: #5f6c7a;
        }
        .result-panel {
            background: #f0f7fc;
            padding: 18px;
            border-radius: 28px;
            text-align: center;
            font-size: 1.2rem;
            font-weight: 500;
            margin: 30px 0 20px;
            border-left: 6px solid #2c7da0;
        }
        .question-card {
            background: #ffffff;
            border: 1px solid #e2e8f0;
            border-radius: 24px;
            margin-bottom: 28px;
            padding: 20px 28px;
            box-shadow: 0 2px 6px rgba(0,0,0,0.03);
        }
        .question-header {
            font-weight: 700;
            font-size: 1.1rem;
            margin-bottom: 16px;
            color: #1a4e6b;
            border-left: 5px solid #2c7da0;
            padding-left: 14px;
        }
        .options {
            display: flex;
            flex-direction: column;
            gap: 12px;
            margin-left: 20px;
            margin-bottom: 5px;
        }
        .options label {
            display: flex;
            align-items: center;
            gap: 14px;
            cursor: pointer;
            font-size: 1rem;
            padding: 6px 12px;
            border-radius: 40px;
            transition: background 0.15s;
        }
        .options label:hover {
            background: #f0f6fe;
        }
        input[type="radio"] {
            width: 18px;
            height: 18px;
            accent-color: #2c7da0;
        }
        .fill-input {
            width: 100%;
            max-width: 450px;
            padding: 10px 16px;
            border-radius: 60px;
            border: 1px solid #cbdde9;
            font-size: 1rem;
            margin: 12px 0 8px;
        }
        .match-row {
            display: flex;
            flex-wrap: wrap;
            gap: 30px;
            margin: 18px 0 10px;
        }
        .match-col {
            flex: 1;
            min-width: 220px;
            background: #fafdff;
            padding: 12px 18px;
            border-radius: 20px;
            border: 1px solid #e6edf4;
        }
        .match-col strong {
            display: block;
            margin-bottom: 14px;
            color: #1c6d8f;
        }
        .match-item {
            margin-bottom: 12px;
        }
        .match-col select {
            width: 100%;
            padding: 8px 12px;
            border-radius: 40px;
            border: 1px solid #cbdde9;
            background: white;
        }
        .feedback {
            margin-top: 14px;
            padding: 8px 16px;
            border-radius: 60px;
            font-size: 0.85rem;
            font-weight: 500;
        }
        .correct-feedback {
            background: #e0f3e4;
            color: #146c2e;
            border-left: 5px solid #2b8c4a;
        }
        .wrong-feedback {
            background: #fee9e8;
            color: #ac2c34;
            border-left: 5px solid #dc3545;
        }
        footer {
            text-align: center;
            font-size: 0.8rem;
            margin-top: 40px;
            color: #6c8e9e;
            border-top: 1px solid #e2edf5;
            padding-top: 20px;
        }
        @media (max-width: 700px) {
            .exam-container { padding: 18px; }
            .question-card { padding: 15px; }
            .options { margin-left: 8px; }
            .match-row { flex-direction: column; }
        }
    </style>
</head>
<body>
<div class="exam-container">
    <h1>📚 Экзамен</h1>
    <div class="sub">Анатомия · Физиология · Патология</div>
    <div class="controls">
        <button id="btnVariant" class="btn-mode">🎲 Случайный вариант (30 вопросов)</button>
        <button id="btnAll" class="btn-mode">📖 Все вопросы (полный экзамен)</button>
        <button id="checkBtn">✅ Завершить и проверить</button>
    </div>
    <div id="resultBlock" class="result-panel">Выберите режим и нажмите «Завершить» после ответов.</div>
    <div id="questionsContainer"></div>
    <footer>В режиме «Вариант» случайно выбираются 30 вопросов (с перемешиванием ответов). В режиме «Все вопросы» отображается вся база без перемешивания (но ответы проверяются).</footer>
</div>

<script>
    // --------------------------------------------------------------
    // ЗАГРУЗКА БАЗЫ ВОПРОСОВ ИЗ ФАЙЛА questions_data.js
    // --------------------------------------------------------------
    let fullBank = [];  // будет заполнено из внешнего файла или из резервной базы

    // Функция для глубокого клонирования вопроса (чтобы не мутировать оригинал)
    function cloneQuestion(q) {
        return JSON.parse(JSON.stringify(q));
    }

    // Перемешивание массива
    function shuffleArray(arr) {
        for (let i = arr.length - 1; i > 0; i--) {
            const j = Math.floor(Math.random() * (i + 1));
            [arr[i], arr[j]] = [arr[j], arr[i]];
        }
        return arr;
    }

    // Перемешивание вариантов ответов внутри вопроса (для choice и match)
    function shuffleOptionsInQuestion(q) {
        if (q.type === 'choice') {
            const origOpt = q.data.options;
            const origCorrect = q.data.correct;
            const indices = origOpt.map((_, idx) => idx);
            shuffleArray(indices);
            const newOpt = indices.map(i => origOpt[i]);
            const newCorrect = indices.indexOf(origCorrect);
            q.data.options = newOpt;
            q.data.correct = newCorrect;
        } else if (q.type === 'match') {
            const right = q.data.right;
            const correctIdx = q.data.correct;
            const indices = right.map((_, idx) => idx);
            shuffleArray(indices);
            const newRight = indices.map(i => right[i]);
            const newCorrect = correctIdx.map(old => indices.indexOf(old));
            q.data.right = newRight;
            q.data.correct = newCorrect;
        }
        return q;
    }

    // Получить случайный вариант из 30 вопросов (с перемешиванием ответов)
    function getRandomVariant(bank, size = 30) {
        if (!bank.length) return [];
        const shuffled = shuffleArray([...bank]);
        const selected = shuffled.slice(0, size).map(q => cloneQuestion(q));
        // перемешиваем ответы в каждом выбранном вопросе
        for (let i = 0; i < selected.length; i++) {
            if (selected[i].type === 'choice' || selected[i].type === 'match') {
                shuffleOptionsInQuestion(selected[i]);
            }
        }
        return selected;
    }

    // Получить все вопросы (без перемешивания ответов, но с клонированием)
    function getAllQuestions(bank) {
        return bank.map(q => cloneQuestion(q));
    }

    // --------------------------------------------------------------
    // ОТРИСОВКА ТЕКУЩЕГО НАБОРА ВОПРОСОВ
    // --------------------------------------------------------------
    let currentQuestions = [];

    function renderQuestions(questionsArray) {
        const container = document.getElementById('questionsContainer');
        container.innerHTML = '';
        if (!questionsArray.length) {
            container.innerHTML = '<div class="result-panel">Нет вопросов. Загрузите базу.</div>';
            return;
        }
        questionsArray.forEach((q, idx) => {
            const card = document.createElement('div');
            card.className = 'question-card';
            const header = document.createElement('div');
            header.className = 'question-header';
            if (q.type === 'choice') header.innerText = `${idx+1}. Выберите один ответ`;
            else if (q.type === 'fill') header.innerText = `${idx+1}. Дополните`;
            else if (q.type === 'match') header.innerText = `${idx+1}. Установите соответствие`;
            else header.innerText = `${idx+1}. Вопрос`;
            card.appendChild(header);

            if (q.type === 'choice') {
                const textDiv = document.createElement('div');
                textDiv.style.marginBottom = '12px';
                textDiv.style.fontWeight = '500';
                textDiv.innerText = q.data.text;
                card.appendChild(textDiv);
                const optionsDiv = document.createElement('div');
                optionsDiv.className = 'options';
                q.data.options.forEach((opt, optIdx) => {
                    const label = document.createElement('label');
                    const radio = document.createElement('input');
                    radio.type = 'radio';
                    radio.name = `q${idx}`;
                    radio.value = optIdx;
                    label.appendChild(radio);
                    label.appendChild(document.createTextNode(opt));
                    optionsDiv.appendChild(label);
                });
                card.appendChild(optionsDiv);
            }
            else if (q.type === 'fill') {
                const textDiv = document.createElement('div');
                textDiv.style.marginBottom = '12px';
                textDiv.style.fontWeight = '500';
                textDiv.innerText = q.data.text;
                card.appendChild(textDiv);
                const input = document.createElement('input');
                input.type = 'text';
                input.className = 'fill-input';
                input.id = `fill-${idx}`;
                card.appendChild(input);
            }
            else if (q.type === 'match') {
                const matchDiv = document.createElement('div');
                matchDiv.className = 'match-row';
                const leftCol = document.createElement('div');
                leftCol.className = 'match-col';
                leftCol.innerHTML = '<strong>Левый столбец</strong><ul style="list-style:none; padding-left:0;"></ul>';
                const ul = leftCol.querySelector('ul');
                q.data.left.forEach((item, i) => {
                    const li = document.createElement('li');
                    li.className = 'match-item';
                    li.innerText = `${i+1}. ${item}`;
                    ul.appendChild(li);
                });
                const rightCol = document.createElement('div');
                rightCol.className = 'match-col';
                rightCol.innerHTML = '<strong>Правый столбец</strong>';
                for (let i = 0; i < q.data.left.length; i++) {
                    const select = document.createElement('select');
                    select.id = `match-${idx}-${i}`;
                    select.innerHTML = '<option value="">-- выберите --</option>';
                    q.data.right.forEach((r, ri) => {
                        const option = document.createElement('option');
                        option.value = ri;
                        option.textContent = r;
                        select.appendChild(option);
                    });
                    const div = document.createElement('div');
                    div.className = 'match-item';
                    div.appendChild(select);
                    rightCol.appendChild(div);
                }
                matchDiv.appendChild(leftCol);
                matchDiv.appendChild(rightCol);
                card.appendChild(matchDiv);
            }
            const feedback = document.createElement('div');
            feedback.className = 'feedback';
            feedback.id = `fb-${idx}`;
            card.appendChild(feedback);
            container.appendChild(card);
        });
    }

    // --------------------------------------------------------------
    // ПРОВЕРКА ВСЕХ ОТВЕТОВ ТЕКУЩЕГО НАБОРА
    // --------------------------------------------------------------
    function checkAllAnswers() {
        if (!currentQuestions.length) {
            alert('Сначала выберите режим (кнопка "Случайный вариант" или "Все вопросы").');
            return;
        }
        let total = currentQuestions.length;
        let correctCount = 0;
        for (let idx = 0; idx < currentQuestions.length; idx++) {
            const q = currentQuestions[idx];
            const fb = document.getElementById(`fb-${idx}`);
            let isCorrect = false;
            let correctAnswerText = '';

            if (q.type === 'choice') {
                const selected = document.querySelector(`input[name="q${idx}"]:checked`);
                if (selected && parseInt(selected.value) === q.data.correct) {
                    isCorrect = true;
                } else {
                    correctAnswerText = q.data.options[q.data.correct];
                }
            }
            else if (q.type === 'fill') {
                const input = document.getElementById(`fill-${idx}`);
                if (input) {
                    const userVal = input.value.trim().toLowerCase();
                    const correctVal = q.data.correctAnswer.toLowerCase();
                    if (userVal === correctVal || (correctVal.includes(userVal) && userVal.length > 2 && userVal !== '')) {
                        isCorrect = true;
                    } else {
                        correctAnswerText = q.data.correctAnswer;
                    }
                } else {
                    correctAnswerText = q.data.correctAnswer;
                }
            }
            else if (q.type === 'match') {
                let allMatch = true;
                for (let i = 0; i < q.data.left.length; i++) {
                    const select = document.getElementById(`match-${idx}-${i}`);
                    const val = select ? parseInt(select.value) : -1;
                    if (val !== q.data.correct[i]) {
                        allMatch = false;
                        break;
                    }
                }
                if (allMatch) {
                    isCorrect = true;
                } else {
                    const pairs = q.data.left.map((l, i) => `${l} → ${q.data.right[q.data.correct[i]]}`).join('; ');
                    correctAnswerText = pairs;
                }
            }

            if (isCorrect) correctCount++;
            if (fb) {
                if (isCorrect) {
                    fb.innerHTML = '✅ Верно';
                    fb.className = 'feedback correct-feedback';
                } else {
                    fb.innerHTML = `❌ Неверно. Правильный ответ: ${correctAnswerText}`;
                    fb.className = 'feedback wrong-feedback';
                }
            }
        }
        const percent = Math.round((correctCount / total) * 100);
        const resultDiv = document.getElementById('resultBlock');
        resultDiv.innerHTML = `📊 Результат: ${correctCount} из ${total} (${percent}%)<br>${percent >= 70 ? '🎉 Экзамен сдан!' : '📚 Повторите материал'}`;
    }

    // --------------------------------------------------------------
    // ЗАГРУЗКА БАЗЫ ИЗ ФАЙЛА (с резервными вопросами, если файла нет)
    // --------------------------------------------------------------
    function loadQuestions() {
        return new Promise((resolve) => {
            if (typeof fullQuestionsData !== 'undefined') {
                fullBank = fullQuestionsData;
                resolve(true);
            } else {
                // Резервная демо-база на случай отсутствия questions_data.js
                console.warn('Файл questions_data.js не загружен, использую демо-вопросы.');
                fullBank = [
                    { type: 'choice', data: { text: "Демо: Какой орган отвечает за иммунитет?", options: ["Печень","Селезенка","Тимус","Почки"], correct: 2 } },
                    { type: 'choice', data: { text: "Сколько пар ребер у человека?", options: ["10","12","14","8"], correct: 1 } },
                    { type: 'fill', data: { text: "Кислород переносится ______", correctAnswer: "гемоглобином" } },
                    { type: 'match', data: { left: ["Артерии","Вены"], right: ["К сердцу","От сердца"], correct: [1,0] } }
                ];
                resolve(true);
            }
        });
    }

    // --------------------------------------------------------------
    // ИНИЦИАЛИЗАЦИЯ И ОБРАБОТЧИКИ
    // --------------------------------------------------------------
    document.getElementById('btnVariant').addEventListener('click', () => {
        if (!fullBank.length) {
            alert('База вопросов не загружена. Подождите или проверьте файл.');
            return;
        }
        currentQuestions = getRandomVariant(fullBank, 30);
        renderQuestions(currentQuestions);
        document.getElementById('resultBlock').innerHTML = 'Случайный вариант из 30 вопросов. Отвечайте и нажмите «Завершить».';
    });

    document.getElementById('btnAll').addEventListener('click', () => {
        if (!fullBank.length) {
            alert('База вопросов не загружена. Подождите или проверьте файл.');
            return;
        }
        currentQuestions = getAllQuestions(fullBank);
        renderQuestions(currentQuestions);
        document.getElementById('resultBlock').innerHTML = `Полный экзамен (${currentQuestions.length} вопросов). Отвечайте и нажмите «Завершить».`;
    });

    document.getElementById('checkBtn').addEventListener('click', checkAllAnswers);

    // Загружаем базу и после этого показываем сообщение
    loadQuestions().then(() => {
        document.getElementById('resultBlock').innerHTML = `База загружена (${fullBank.length} вопросов). Выберите режим.`;
    });
</script>
</body>
</html>
