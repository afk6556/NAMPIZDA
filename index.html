<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Экзамен: Анатомия и физиология</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Segoe UI', Roboto, 'Helvetica Neue', sans-serif;
            background: #eef2f5;
            padding: 30px 20px;
            color: #1e2f3a;
        }
        .exam-container {
            max-width: 1100px;
            margin: 0 auto;
            background: white;
            border-radius: 28px;
            box-shadow: 0 20px 35px -12px rgba(0,0,0,0.15);
            padding: 30px 35px;
        }
        h1 {
            text-align: center;
            color: #1c6d8f;
            font-size: 1.9rem;
            margin-bottom: 8px;
            border-bottom: 3px solid #cbdde9;
            padding-bottom: 12px;
        }
        .sub {
            text-align: center;
            color: #3d6e8b;
            margin-bottom: 20px;
            font-style: italic;
        }
        .controls {
            display: flex;
            justify-content: center;
            gap: 20px;
            margin: 20px 0;
            flex-wrap: wrap;
        }
        button {
            background: #2c7da0;
            color: white;
            border: none;
            padding: 10px 28px;
            font-size: 1rem;
            border-radius: 60px;
            font-weight: bold;
            cursor: pointer;
            transition: 0.2s;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
        }
        button:hover {
            background: #1f5e7a;
            transform: scale(1.02);
        }
        .btn-mode {
            background: #5f6c7a;
        }
        .result-panel {
            background: #f0f7fc;
            padding: 18px;
            border-radius: 28px;
            text-align: center;
            font-size: 1.2rem;
            font-weight: 500;
            margin: 30px 0 20px;
            border-left: 6px solid #2c7da0;
        }
        .question-card {
            background: #ffffff;
            border: 1px solid #e2e8f0;
            border-radius: 24px;
            margin-bottom: 28px;
            padding: 20px 28px;
            box-shadow: 0 2px 6px rgba(0,0,0,0.03);
        }
        .question-header {
            font-weight: 700;
            font-size: 1.1rem;
            margin-bottom: 16px;
            color: #1a4e6b;
            border-left: 5px solid #2c7da0;
            padding-left: 14px;
        }
        .options {
            display: flex;
            flex-direction: column;
            gap: 12px;
            margin-left: 20px;
            margin-bottom: 5px;
        }
        .options label {
            display: flex;
            align-items: center;
            gap: 14px;
            cursor: pointer;
            font-size: 1rem;
            padding: 6px 12px;
            border-radius: 40px;
            transition: background 0.15s;
        }
        .options label:hover {
            background: #f0f6fe;
        }
        input[type="radio"] {
            width: 18px;
            height: 18px;
            accent-color: #2c7da0;
        }
        .fill-input {
            width: 100%;
            max-width: 450px;
            padding: 10px 16px;
            border-radius: 60px;
            border: 1px solid #cbdde9;
            font-size: 1rem;
            margin: 12px 0 8px;
        }
        .match-row {
            display: flex;
            flex-wrap: wrap;
            gap: 30px;
            margin: 18px 0 10px;
        }
        .match-col {
            flex: 1;
            min-width: 220px;
            background: #fafdff;
            padding: 12px 18px;
            border-radius: 20px;
            border: 1px solid #e6edf4;
        }
        .match-col strong {
            display: block;
            margin-bottom: 14px;
            color: #1c6d8f;
        }
        .match-item {
            margin-bottom: 12px;
        }
        .match-col select {
            width: 100%;
            padding: 8px 12px;
            border-radius: 40px;
            border: 1px solid #cbdde9;
            background: white;
        }
        .feedback {
            margin-top: 14px;
            padding: 8px 16px;
            border-radius: 60px;
            font-size: 0.85rem;
            font-weight: 500;
        }
        .correct-feedback {
            background: #e0f3e4;
            color: #146c2e;
            border-left: 5px solid #2b8c4a;
        }
        .wrong-feedback {
            background: #fee9e8;
            color: #ac2c34;
            border-left: 5px solid #dc3545;
        }
        footer {
            text-align: center;
            font-size: 0.8rem;
            margin-top: 40px;
            color: #6c8e9e;
            border-top: 1px solid #e2edf5;
            padding-top: 20px;
        }
        @media (max-width: 700px) {
            .exam-container { padding: 18px; }
            .question-card { padding: 15px; }
            .options { margin-left: 8px; }
            .match-row { flex-direction: column; }
        }
    </style>
</head>
<body>
<div class="exam-container">
    <h1>📚 Экзамен</h1>
    <div class="sub">Анатомия · Физиология · Патология</div>
    <div class="controls">
        <button id="btnVariant" class="btn-mode">🎲 Случайный вариант (30 вопросов)</button>
        <button id="btnAll" class="btn-mode">📖 Все вопросы (перемешаны)</button>
        <button id="checkBtn">📊 Показать общий результат</button>
    </div>
    <div id="resultBlock" class="result-panel">Выберите режим. Ответы проверяются сразу.</div>
    <div id="questionsContainer"></div>
    <footer>✔️ Ответы проверяются мгновенно. В режиме варианта вопросы не повторяются, пока не пройдёте все.</footer>
</div>

<script src="questions_data.js"></script>
<script>
    let fullBank = [];          // исходная база
    let currentQuestions = [];  // текущий отображаемый набор (массив объектов)
    let remainingPool = [];     // для режима варианта: список ещё не выданных вопросов (перемешанная копия fullBank)
    let variantModeActive = false;

    // Загрузка базы из внешнего файла
    if (typeof fullQuestionsData !== 'undefined' && Array.isArray(fullQuestionsData)) {
        fullBank = fullQuestionsData;
        console.log(`База загружена: ${fullBank.length} вопросов`);
    } else {
        console.error("fullQuestionsData не найдена");
        document.getElementById('resultBlock').innerHTML = '❌ Ошибка: не найден файл questions_data.js или переменная fullQuestionsData.';
    }

    // Перемешивание массива (ФИШЕР-ЙЕТС)
    function shuffleArray(arr) {
        const a = [...arr];
        for (let i = a.length - 1; i > 0; i--) {
            const j = Math.floor(Math.random() * (i + 1));
            [a[i], a[j]] = [a[j], a[i]];
        }
        return a;
    }

    // Перемешивание вариантов ответов внутри вопроса (choice и match)
    function shuffleOptionsInQuestion(q) {
        const clone = JSON.parse(JSON.stringify(q));
        if (clone.type === 'choice') {
            const indices = clone.data.options.map((_, i) => i);
            shuffleArray(indices);
            clone.data.options = indices.map(i => clone.data.options[i]);
            clone.data.correct = indices.indexOf(clone.data.correct);
        } else if (clone.type === 'match') {
            const rightIndices = clone.data.right.map((_, i) => i);
            shuffleArray(rightIndices);
            clone.data.right = rightIndices.map(i => clone.data.right[i]);
            clone.data.correct = clone.data.correct.map(old => rightIndices.indexOf(old));
        }
        return clone;
    }

    // Обновить пул оставшихся вопросов для вариантного режима (если пуст – пересоздать)
    function ensureRemainingPool() {
        if (!remainingPool.length) {
            // Создаём перемешанную копию всех вопросов, но без перемешивания ответов (это будем делать при выдаче варианта)
            remainingPool = shuffleArray([...fullBank]);
            // Дополнительно можно показать уведомление
            const resultDiv = document.getElementById('resultBlock');
            if (resultDiv && variantModeActive) {
                resultDiv.innerHTML = '🔄 Начат новый круг вопросов (все вопросы розданы).';
                setTimeout(() => {
                    if (variantModeActive) resultDiv.innerHTML = 'Режим варианта: вопросы не повторяются.';
                }, 2000);
            }
        }
    }

    // Получить случайный вариант из size вопросов (без повторов, из remainingPool)
    function getVariantQuestions(size = 30) {
        if (!fullBank.length) return [];
        ensureRemainingPool();
        const taken = [];
        const takeCount = Math.min(size, remainingPool.length);
        for (let i = 0; i < takeCount; i++) {
            taken.push(remainingPool.shift()); // берём из начала (очередь)
        }
        // Если после этого remainingPool опустел – при следующем вызове ensureRemainingPool() создаст новый
        // Теперь нужно перемешать варианты ответов внутри каждого взятого вопроса (чтобы каждый вариант был свежим)
        return taken.map(q => shuffleOptionsInQuestion(q));
    }

    // Получить все вопросы, но в случайном порядке (с перемешиванием порядка и ответов)
    function getAllShuffledQuestions() {
        if (!fullBank.length) return [];
        // Перемешиваем порядок вопросов
        const shuffledOrder = shuffleArray([...fullBank]);
        // Перемешиваем ответы внутри каждого (choice и match)
        return shuffledOrder.map(q => shuffleOptionsInQuestion(q));
    }

    // Проверка одного вопроса (отображение обратной связи)
    function checkSingleQuestion(q, idx, showFeedback = true) {
        const fb = document.getElementById(`fb-${idx}`);
        if (!fb) return false;
        let isCorrect = false;
        let correctAnswer = '';

        if (q.type === 'choice') {
            const selected = document.querySelector(`input[name="q${idx}"]:checked`);
            if (selected && parseInt(selected.value) === q.data.correct) {
                isCorrect = true;
            } else {
                correctAnswer = q.data.options[q.data.correct];
            }
        } 
        else if (q.type === 'fill') {
            const input = document.getElementById(`fill-${idx}`);
            if (input) {
                const userVal = input.value.trim().toLowerCase();
                const correctVal = q.data.correctAnswer.toLowerCase();
                if (userVal === correctVal || (correctVal.includes(userVal) && userVal.length > 2 && userVal !== "")) {
                    isCorrect = true;
                } else {
                    correctAnswer = q.data.correctAnswer;
                }
            }
        }
        else if (q.type === 'match') {
            let allMatch = true;
            for (let i = 0; i < q.data.left.length; i++) {
                const select = document.getElementById(`match-${idx}-${i}`);
                const val = select ? parseInt(select.value) : -1;
                if (val !== q.data.correct[i]) {
                    allMatch = false;
                    break;
                }
            }
            if (allMatch) {
                isCorrect = true;
            } else {
                const pairs = q.data.left.map((l, i) => `${l} → ${q.data.right[q.data.correct[i]]}`).join('; ');
                correctAnswer = pairs;
            }
        }

        if (showFeedback) {
            if (isCorrect) {
                fb.innerHTML = '✅ Верно';
                fb.className = 'feedback correct-feedback';
            } else {
                fb.innerHTML = `❌ Неверно. Правильный ответ: ${correctAnswer}`;
                fb.className = 'feedback wrong-feedback';
            }
        }
        return isCorrect;
    }

    // Подсчёт общего количества правильных ответов на текущей странице
    function computeTotalCorrect() {
        let correct = 0;
        for (let idx = 0; idx < currentQuestions.length; idx++) {
            const q = currentQuestions[idx];
            if (q.type === 'choice') {
                const selected = document.querySelector(`input[name="q${idx}"]:checked`);
                if (selected && parseInt(selected.value) === q.data.correct) correct++;
            } else if (q.type === 'fill') {
                const input = document.getElementById(`fill-${idx}`);
                if (input) {
                    const userVal = input.value.trim().toLowerCase();
                    const correctVal = q.data.correctAnswer.toLowerCase();
                    if (userVal === correctVal || (correctVal.includes(userVal) && userVal.length > 2 && userVal !== "")) correct++;
                }
            } else if (q.type === 'match') {
                let allMatch = true;
                for (let i = 0; i < q.data.left.length; i++) {
                    const select = document.getElementById(`match-${idx}-${i}`);
                    const val = select ? parseInt(select.value) : -1;
                    if (val !== q.data.correct[i]) { allMatch = false; break; }
                }
                if (allMatch) correct++;
            }
        }
        return correct;
    }

    // Отрисовка вопросов и привязка обработчиков мгновенной проверки
    function renderQuestions(questions) {
        const container = document.getElementById('questionsContainer');
        container.innerHTML = '';
        if (!questions.length) {
            container.innerHTML = '<div class="result-panel">Нет вопросов для отображения</div>';
            return;
        }
        questions.forEach((q, idx) => {
            const card = document.createElement('div');
            card.className = 'question-card';
            const header = document.createElement('div');
            header.className = 'question-header';
            if (q.type === 'choice') header.innerText = `${idx+1}. Выберите один ответ`;
            else if (q.type === 'fill') header.innerText = `${idx+1}. Дополните`;
            else if (q.type === 'match') header.innerText = `${idx+1}. Установите соответствие`;
            card.appendChild(header);

            if (q.type === 'choice') {
                const textDiv = document.createElement('div');
                textDiv.style.marginBottom = '12px';
                textDiv.style.fontWeight = '500';
                textDiv.innerText = q.data.text;
                card.appendChild(textDiv);
                const optionsDiv = document.createElement('div');
                optionsDiv.className = 'options';
                q.data.options.forEach((opt, optIdx) => {
                    const label = document.createElement('label');
                    const radio = document.createElement('input');
                    radio.type = 'radio';
                    radio.name = `q${idx}`;
                    radio.value = optIdx;
                    label.appendChild(radio);
                    label.appendChild(document.createTextNode(opt));
                    optionsDiv.appendChild(label);
                });
                card.appendChild(optionsDiv);
            } 
            else if (q.type === 'fill') {
                const textDiv = document.createElement('div');
                textDiv.style.marginBottom = '12px';
                textDiv.style.fontWeight = '500';
                textDiv.innerText = q.data.text;
                card.appendChild(textDiv);
                const input = document.createElement('input');
                input.type = 'text';
                input.className = 'fill-input';
                input.id = `fill-${idx}`;
                card.appendChild(input);
            }
            else if (q.type === 'match') {
                const matchDiv = document.createElement('div');
                matchDiv.className = 'match-row';
                const leftCol = document.createElement('div');
                leftCol.className = 'match-col';
                leftCol.innerHTML = '<strong>Левый столбец</strong><ul style="list-style:none; padding-left:0;"></ul>';
                const ul = leftCol.querySelector('ul');
                q.data.left.forEach((item, i) => {
                    const li = document.createElement('li');
                    li.className = 'match-item';
                    li.innerText = `${i+1}. ${item}`;
                    ul.appendChild(li);
                });
                const rightCol = document.createElement('div');
                rightCol.className = 'match-col';
                rightCol.innerHTML = '<strong>Правый столбец</strong>';
                for (let i = 0; i < q.data.left.length; i++) {
                    const select = document.createElement('select');
                    select.id = `match-${idx}-${i}`;
                    select.innerHTML = '<option value="">-- выберите --</option>';
                    q.data.right.forEach((r, ri) => {
                        const option = document.createElement('option');
                        option.value = ri;
                        option.textContent = r;
                        select.appendChild(option);
                    });
                    const div = document.createElement('div');
                    div.className = 'match-item';
                    div.appendChild(select);
                    rightCol.appendChild(div);
                }
                matchDiv.appendChild(leftCol);
                matchDiv.appendChild(rightCol);
                card.appendChild(matchDiv);
            }
            const feedback = document.createElement('div');
            feedback.className = 'feedback';
            feedback.id = `fb-${idx}`;
            card.appendChild(feedback);
            container.appendChild(card);
        });

        // Привязываем обработчики мгновенной проверки
        for (let idx = 0; idx < questions.length; idx++) {
            const q = questions[idx];
            if (q.type === 'choice') {
                const radios = document.querySelectorAll(`input[name="q${idx}"]`);
                radios.forEach(radio => {
                    radio.addEventListener('change', () => checkSingleQuestion(q, idx, true));
                });
            } else if (q.type === 'fill') {
                const input = document.getElementById(`fill-${idx}`);
                if (input) {
                    input.addEventListener('input', () => checkSingleQuestion(q, idx, true));
                }
            } else if (q.type === 'match') {
                for (let i = 0; i < q.data.left.length; i++) {
                    const select = document.getElementById(`match-${idx}-${i}`);
                    if (select) {
                        select.addEventListener('change', () => checkSingleQuestion(q, idx, true));
                    }
                }
            }
        }
    }

    // Показать общий результат по текущему набору
    function showOverallResult() {
        if (!currentQuestions.length) {
            alert('Сначала выберите режим (кнопка "Случайный вариант" или "Все вопросы").');
            return;
        }
        const correct = computeTotalCorrect();
        const total = currentQuestions.length;
        const percent = Math.round((correct / total) * 100);
        document.getElementById('resultBlock').innerHTML = `📊 Общий результат: ${correct} из ${total} (${percent}%)<br>${percent >= 70 ? '🎉 Экзамен сдан!' : '📚 Повторите материал'}`;
    }

    // Режим "Случайный вариант"
    function activateVariantMode() {
        if (!fullBank.length) {
            alert('База вопросов не загружена.');
            return;
        }
        variantModeActive = true;
        // Убедимся, что пул остался или создастся
        ensureRemainingPool();
        const variant = getVariantQuestions(30);
        currentQuestions = variant;
        renderQuestions(currentQuestions);
        document.getElementById('resultBlock').innerHTML = `Случайный вариант (30 вопросов). Осталось в пуле: ${remainingPool.length} новых вопросов.`;
    }

    // Режим "Все вопросы" (перемешанные)
    function activateAllMode() {
        if (!fullBank.length) {
            alert('База вопросов не загружена.');
            return;
        }
        variantModeActive = false;
        const allShuffled = getAllShuffledQuestions();
        currentQuestions = allShuffled;
        renderQuestions(currentQuestions);
        document.getElementById('resultBlock').innerHTML = `Полный экзамен (${currentQuestions.length} вопросов, перемешан).`;
    }

    // Обработчики кнопок
    document.getElementById('btnVariant').addEventListener('click', activateVariantMode);
    document.getElementById('btnAll').addEventListener('click', activateAllMode);
    document.getElementById('checkBtn').addEventListener('click', showOverallResult);

    // Инициализация (можно сразу включить режим варианта, но пусть будет просто информационное сообщение)
    if (fullBank.length) {
        document.getElementById('resultBlock').innerHTML = `База загружена: ${fullBank.length} вопросов. Выберите режим.`;
    } else {
        document.getElementById('resultBlock').innerHTML = '❌ Ошибка: база не загружена. Убедитесь, что questions_data.js лежит рядом.';
    }
</script>
</body>
</html>
