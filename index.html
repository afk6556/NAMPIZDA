<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Экзамен: генератор вариантов</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: 'Segoe UI', Roboto, 'Helvetica Neue', sans-serif;
            background: #eef2f5;
            padding: 30px 20px;
            color: #1e2f3a;
        }
        .exam-container {
            max-width: 1100px;
            margin: 0 auto;
            background: white;
            border-radius: 28px;
            box-shadow: 0 20px 35px -12px rgba(0,0,0,0.15);
            padding: 30px 35px;
        }
        h1 {
            text-align: center;
            color: #1c6d8f;
            font-size: 1.9rem;
            margin-bottom: 8px;
            border-bottom: 3px solid #cbdde9;
            display: inline-block;
            width: 100%;
            padding-bottom: 12px;
        }
        .sub {
            text-align: center;
            color: #3d6e8b;
            margin-bottom: 20px;
            font-style: italic;
        }
        .controls {
            display: flex;
            justify-content: center;
            gap: 20px;
            margin: 20px 0;
            flex-wrap: wrap;
        }
        button {
            background: #2c7da0;
            color: white;
            border: none;
            padding: 10px 28px;
            font-size: 1rem;
            border-radius: 60px;
            font-weight: bold;
            cursor: pointer;
            transition: 0.2s;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
        }
        button:hover {
            background: #1f5e7a;
            transform: scale(1.02);
        }
        .btn-generate {
            background: #5f6c7a;
        }
        .result-panel {
            background: #f0f7fc;
            padding: 18px;
            border-radius: 28px;
            text-align: center;
            font-size: 1.2rem;
            font-weight: 500;
            margin: 30px 0 20px;
            border-left: 6px solid #2c7da0;
        }
        .question-card {
            background: #ffffff;
            border: 1px solid #e2e8f0;
            border-radius: 24px;
            margin-bottom: 28px;
            padding: 20px 28px;
            box-shadow: 0 2px 6px rgba(0,0,0,0.03);
        }
        .question-header {
            font-weight: 700;
            font-size: 1.1rem;
            margin-bottom: 16px;
            color: #1a4e6b;
            border-left: 5px solid #2c7da0;
            padding-left: 14px;
        }
        .options {
            display: flex;
            flex-direction: column;
            gap: 12px;
            margin-left: 20px;
            margin-bottom: 5px;
        }
        .options label {
            display: flex;
            align-items: center;
            gap: 14px;
            cursor: pointer;
            font-size: 1rem;
            padding: 6px 12px;
            border-radius: 40px;
            transition: background 0.15s;
        }
        .options label:hover {
            background: #f0f6fe;
        }
        input[type="radio"] {
            width: 18px;
            height: 18px;
            accent-color: #2c7da0;
        }
        .fill-input {
            width: 100%;
            max-width: 450px;
            padding: 10px 16px;
            border-radius: 60px;
            border: 1px solid #cbdde9;
            font-size: 1rem;
            margin: 12px 0 8px;
        }
        .match-row {
            display: flex;
            flex-wrap: wrap;
            gap: 30px;
            margin: 18px 0 10px;
        }
        .match-col {
            flex: 1;
            min-width: 220px;
            background: #fafdff;
            padding: 12px 18px;
            border-radius: 20px;
            border: 1px solid #e6edf4;
        }
        .match-col strong {
            display: block;
            margin-bottom: 14px;
            color: #1c6d8f;
        }
        .match-item {
            margin-bottom: 12px;
        }
        .match-col select {
            width: 100%;
            padding: 8px 12px;
            border-radius: 40px;
            border: 1px solid #cbdde9;
            background: white;
        }
        .feedback {
            margin-top: 14px;
            padding: 8px 16px;
            border-radius: 60px;
            font-size: 0.85rem;
            font-weight: 500;
        }
        .correct-feedback {
            background: #e0f3e4;
            color: #146c2e;
            border-left: 5px solid #2b8c4a;
        }
        .wrong-feedback {
            background: #fee9e8;
            color: #ac2c34;
            border-left: 5px solid #dc3545;
        }
        footer {
            text-align: center;
            font-size: 0.8rem;
            margin-top: 40px;
            color: #6c8e9e;
            border-top: 1px solid #e2edf5;
            padding-top: 20px;
        }
        @media (max-width: 700px) {
            .exam-container { padding: 18px; }
            .question-card { padding: 15px; }
            .options { margin-left: 8px; }
            .match-row { flex-direction: column; }
        }
    </style>
</head>
<body>
<div class="exam-container">
    <h1>📚 Экзамен</h1>
    <div class="sub">Анатомия · Физиология · Патология</div>
    <div class="controls">
        <button id="generateBtn" class="btn-generate">🎲 Создать вариант (30 вопросов)</button>
        <button id="checkBtn">✅ Завершить вариант</button>
    </div>
    <div id="resultBlock" class="result-panel">Нажмите «Создать вариант» для начала.</div>
    <div id="questionsContainer"></div>
    <footer>Каждый вариант содержит 30 случайных вопросов из общей базы. Ответы сохраняются при смене варианта.</footer>
</div>

<script src="questions_data.js"></script>
<script>
    // Массив fullQuestionsData должен быть определён в подключаемом файле
    if (typeof fullQuestionsData === 'undefined') {
        console.error("Файл questions_data.js не загружен или переменная fullQuestionsData не найдена.");
        alert("Ошибка: не найден файл questions_data.js. Убедитесь, что он лежит в той же папке.");
    }

    let currentVariant = [];  // выбранные 30 вопросов

    // Функция случайного перемешивания массива
    function shuffleArray(arr) {
        for (let i = arr.length - 1; i > 0; i--) {
            const j = Math.floor(Math.random() * (i + 1));
            [arr[i], arr[j]] = [arr[j], arr[i]];
        }
        return arr;
    }

    // Перемешивание вариантов ответов для choice и match (для match – правый столбец)
    function shuffleOptionsInQuestions(questionsArray) {
        for (let q of questionsArray) {
            if (q.type === 'choice') {
                const origOptions = q.data.options;
                const origCorrect = q.data.correct;
                const indices = origOptions.map((_, idx) => idx);
                shuffleArray(indices);
                const newOptions = indices.map(i => origOptions[i]);
                const newCorrect = indices.indexOf(origCorrect);
                q.data.options = newOptions;
                q.data.correct = newCorrect;
            } else if (q.type === 'match') {
                const rightItems = q.data.right;
                const correctIndices = q.data.correct;
                const rightIndices = rightItems.map((_, idx) => idx);
                shuffleArray(rightIndices);
                const newRight = rightIndices.map(i => rightItems[i]);
                const newCorrect = q.data.correct.map(oldIdx => rightIndices.indexOf(oldIdx));
                q.data.right = newRight;
                q.data.correct = newCorrect;
            }
        }
        return questionsArray;
    }

    // Выбор случайных 30 вопросов (без повторов)
    function getRandomVariant(bank, size = 30) {
        if (bank.length < size) {
            console.warn("В базе меньше 30 вопросов, возвращаю все имеющиеся.");
            return [...bank];
        }
        const shuffledBank = shuffleArray([...bank]);
        // Возвращаем копию первых size вопросов, но без перемешивания их внутренностей – это сделаем отдельно
        const selected = shuffledBank.slice(0, size).map(q => JSON.parse(JSON.stringify(q))); // глубокое копирование
        // Перемешиваем варианты ответов внутри каждого вопроса (для choice и match)
        return shuffleOptionsInQuestions(selected);
    }

    // Отрисовка текущего варианта
    function renderVariant(variant) {
        const container = document.getElementById("questionsContainer");
        container.innerHTML = "";
        variant.forEach((q, idx) => {
            const card = document.createElement("div");
            card.className = "question-card";
            card.dataset.qid = idx;
            const header = document.createElement("div");
            header.className = "question-header";
            if (q.type === "choice") header.innerText = `${idx+1}. Выберите один ответ`;
            else if (q.type === "fill") header.innerText = `${idx+1}. Дополните`;
            else if (q.type === "match") header.innerText = `${idx+1}. Установите соответствие`;
            else header.innerText = `${idx+1}. Вопрос`;
            card.appendChild(header);
            
            if (q.type === "choice") {
                const textDiv = document.createElement("div");
                textDiv.style.marginBottom = "12px";
                textDiv.style.fontWeight = "500";
                textDiv.innerText = q.data.text;
                card.appendChild(textDiv);
                const optionsDiv = document.createElement("div");
                optionsDiv.className = "options";
                q.data.options.forEach((opt, optIdx) => {
                    const label = document.createElement("label");
                    const radio = document.createElement("input");
                    radio.type = "radio";
                    radio.name = `q${idx}`;
                    radio.value = optIdx;
                    label.appendChild(radio);
                    label.appendChild(document.createTextNode(opt));
                    optionsDiv.appendChild(label);
                });
                card.appendChild(optionsDiv);
            } 
            else if (q.type === "fill") {
                const textDiv = document.createElement("div");
                textDiv.style.marginBottom = "12px";
                textDiv.style.fontWeight = "500";
                textDiv.innerText = q.data.text;
                card.appendChild(textDiv);
                const input = document.createElement("input");
                input.type = "text";
                input.className = "fill-input";
                input.id = `fill-${idx}`;
                card.appendChild(input);
            }
            else if (q.type === "match") {
                const matchDiv = document.createElement("div");
                matchDiv.className = "match-row";
                const leftCol = document.createElement("div");
                leftCol.className = "match-col";
                leftCol.innerHTML = "<strong>Левый столбец</strong><ul style='list-style:none; padding-left:0;'></ul>";
                const ul = leftCol.querySelector("ul");
                q.data.left.forEach((item, i) => {
                    const li = document.createElement("li");
                    li.className = "match-item";
                    li.innerText = `${i+1}. ${item}`;
                    ul.appendChild(li);
                });
                const rightCol = document.createElement("div");
                rightCol.className = "match-col";
                rightCol.innerHTML = "<strong>Правый столбец</strong>";
                for (let i = 0; i < q.data.left.length; i++) {
                    const select = document.createElement("select");
                    select.id = `match-${idx}-${i}`;
                    select.innerHTML = `<option value="">-- выберите --</option>`;
                    q.data.right.forEach((r, ri) => {
                        const option = document.createElement("option");
                        option.value = ri;
                        option.textContent = r;
                        select.appendChild(option);
                    });
                    const div = document.createElement("div");
                    div.className = "match-item";
                    div.appendChild(select);
                    rightCol.appendChild(div);
                }
                matchDiv.appendChild(leftCol);
                matchDiv.appendChild(rightCol);
                card.appendChild(matchDiv);
            }
            const feedback = document.createElement("div");
            feedback.className = "feedback";
            feedback.id = `fb-${idx}`;
            card.appendChild(feedback);
            container.appendChild(card);
        });
    }

    // Проверка всех ответов текущего варианта
    function checkVariant(variant) {
        let total = variant.length;
        let correctCount = 0;
        variant.forEach((q, idx) => {
            const fb = document.getElementById(`fb-${idx}`);
            let isCorrect = false;
            let correctAnswerText = "";
            if (q.type === "choice") {
                const selected = document.querySelector(`input[name="q${idx}"]:checked`);
                if (selected && parseInt(selected.value) === q.data.correct) {
                    isCorrect = true;
                } else {
                    correctAnswerText = q.data.options[q.data.correct];
                }
            } 
            else if (q.type === "fill") {
                const input = document.getElementById(`fill-${idx}`);
                if (input) {
                    const userVal = input.value.trim().toLowerCase();
                    const correctVal = q.data.correctAnswer.toLowerCase();
                    if (userVal === correctVal || (correctVal.includes(userVal) && userVal.length > 2 && userVal !== "")) {
                        isCorrect = true;
                    } else {
                        correctAnswerText = q.data.correctAnswer;
                    }
                } else {
                    correctAnswerText = q.data.correctAnswer;
                }
            }
            else if (q.type === "match") {
                let allMatch = true;
                for (let i = 0; i < q.data.left.length; i++) {
                    const select = document.getElementById(`match-${idx}-${i}`);
                    const val = select ? parseInt(select.value) : -1;
                    if (val !== q.data.correct[i]) {
                        allMatch = false;
                        break;
                    }
                }
                if (allMatch) isCorrect = true;
                else {
                    const pairs = q.data.left.map((l, i) => `${l} → ${q.data.right[q.data.correct[i]]}`).join("; ");
                    correctAnswerText = pairs;
                }
            }
            if (isCorrect) correctCount++;
            if (fb) {
                if (isCorrect) {
                    fb.innerHTML = "✅ Верно";
                    fb.className = "feedback correct-feedback";
                } else {
                    fb.innerHTML = `❌ Неверно. Правильный ответ: ${correctAnswerText}`;
                    fb.className = "feedback wrong-feedback";
                }
            }
        });
        const percent = Math.round((correctCount / total) * 100);
        const resultDiv = document.getElementById("resultBlock");
        resultDiv.innerHTML = `📊 Результат: ${correctCount} из ${total} (${percent}%)<br>${percent >= 70 ? "🎉 Экзамен сдан!" : "📚 Повторите материал"}`;
    }

    // Генерация нового варианта
    function generateNewVariant() {
        if (!fullQuestionsData) {
            alert("База вопросов не загружена. Проверьте файл questions_data.js");
            return;
        }
        currentVariant = getRandomVariant(fullQuestionsData, 30);
        renderVariant(currentVariant);
        document.getElementById("resultBlock").innerHTML = "Новый вариант из 30 вопросов. Отвечайте и нажмите «Завершить вариант».";
        // Очищаем все старые сообщения обратной связи (на случай, если остались)
        const allFeedbacks = document.querySelectorAll(".feedback");
        allFeedbacks.forEach(fb => {
            fb.innerHTML = "";
            fb.className = "feedback";
        });
    }

    // Обработчики кнопок
    document.getElementById("generateBtn").addEventListener("click", () => {
        generateNewVariant();
    });
    document.getElementById("checkBtn").addEventListener("click", () => {
        if (currentVariant.length === 0) {
            alert("Сначала создайте вариант (кнопка «Создать вариант»).");
            return;
        }
        checkVariant(currentVariant);
    });

    // Автоматически создаём первый вариант при загрузке
    generateNewVariant();
</script>
</body>
</html>
